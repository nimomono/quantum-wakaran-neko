name: draft-81 generate and validate

on:
  push:
    branches:
      - draft-81-classical-primary-framing
    paths-ignore:
      - paper.md
      - main.tex
      - paper.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-81-classical-primary-framing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: verify
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script"; done
          grep -Fq '量子力学に特徴的な状態空間、可逆力学、Born型測定統計、測定後状態' sections/01_scope_and_cycle.md
          grep -Fq 'ブラックボックスとしての運用上の複雑度' sections/08_errors_resources_open_targets.md
          grep -Fq '信号作用 $S$ を指数的に増やせば' sections/08_errors_resources_open_targets.md
          grep -Fq 'version: "draft-81"' CITATION.cff
          grep -Fq 'draft-81 改訂稿' tools/template.tex
      - name: build
        run: |
          python tools/build_paper.py
          git diff --check
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then exit 1; fi
          pdfinfo paper.pdf | grep '^Pages:'
          pdfinfo paper.pdf | grep '^Page size:'
      - name: commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "draft-81: regenerate manuscript artifacts [generated]"
          git push origin HEAD:draft-81-classical-primary-framing
