name: M64 temporary build artifact

on:
  push:
    branches:
      - draft-109-m64-three-entity-open-q3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - name: Run M64 candidate checks
        run: |
          python tools/candidate_checks/verify_m64_reservoir_partition.py
          python tools/candidate_checks/verify_m64_overdamped_reduction.py
          python tools/candidate_checks/verify_m64_r161_finite_volume.py
      - name: Run source checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
      - name: Build generated paper
        run: python tools/build_paper.py --output-dir build/m64-ci
      - name: Check LaTeX
        run: |
          python tools/check_latex_semantics.py build/m64-ci/latex/main.log
          python tools/lint_typeset.py build/m64-ci/latex/main.log
      - uses: actions/upload-artifact@v4
        with:
          name: m64-generated-paper
          path: |
            build/m64-ci/paper.md
            build/m64-ci/main.tex
            build/m64-ci/paper.pdf
            build/m64-ci/latex/main.log
