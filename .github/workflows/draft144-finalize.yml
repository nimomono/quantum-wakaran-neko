name: draft-144 finalize

on:
  push:
    branches:
      - draft-144-m67-dumbbell-q3-candidate

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - name: source and physics checks
        run: |
          python -m compileall -q tools simulations/m67
          python tools/check_source.py
          python tools/check_project_consistency.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          python tools/run_physics_checks.py --include-candidate
          python tools/migrations/check_draft144_m67_dumbbell_candidate.py
          python tools/candidate_checks/verify_r214a_dumbbell_partition.py
          python tools/candidate_checks/verify_r214b_dumbbell_dynamic_bridge.py
          python simulations/m67/run_r214_dumbbell_q3_witness.py --trajectories 6000 --steps 5000
      - name: regenerate paper
        run: |
          python tools/build_paper.py
          python tools/check_latex_semantics.py build/latex/main.log
          python tools/lint_typeset.py build/latex/main.log
          git diff --check
      - name: commit generated artifacts
        run: |
          if git diff --quiet -- paper.md main.tex paper.pdf; then
            echo "generated artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          git commit -m "draft-144: generated artifactsを同期"
          git push
