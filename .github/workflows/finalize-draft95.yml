name: finalize-draft95

on:
  push:
    branches: [draft-m57-tl-tracer-q3-microphysics]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: draft-m57-tl-tracer-q3-microphysics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync source wording
        run: python tools/finalize_draft95.py
      - name: Install numeric and typesetting dependencies
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - name: Validate physics and source
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
      - name: Rebuild paper
        run: python tools/build_paper.py
      - name: Check diff
        run: git diff --check
      - name: Remove temporary finalizer
        run: rm -f .github/workflows/export-generated-draft95.yml .github/workflows/finalize-draft95.yml tools/finalize_draft95.py
      - name: Commit and push
        run: |
          git config user.name "Dr. Pot-au-Feu"
          git config user.email "146850541+nimomono@users.noreply.github.com"
          git add -A
          git commit -m "draft-95: finalize M57 Q3 microphysics and generated paper"
          git push origin HEAD:draft-m57-tl-tracer-q3-microphysics
