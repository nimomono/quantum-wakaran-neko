name: draft-87 regenerate final artifacts

on:
  push:
    branches:
      - docs/open-bath-simplification

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/open-bath-simplification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Verify and regenerate
        run: |
          python tools/verify_terminology.py
          python tools/build_paper.py
          git diff --check
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          git rm .github/workflows/draft87-regenerate-final.yml
          git commit -m "draft-87: regenerate final manuscript artifacts"
          git push origin HEAD:docs/open-bath-simplification
