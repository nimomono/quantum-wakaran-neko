name: R192 final retirement cleanup

on:
  push:
    branches:
      - draft-r192-r181a-retirement

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final consistency cleanup
        run: python tools/_finalize_r192_retirement_once.py

      - name: Check retired-spine residues
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -F '振幅再調整用接続端' sections; then exit 1; fi
          if rg -n -F '設定先行2端Hopf受信機構' sections; then exit 1; fi
          if rg -n -F '\varepsilon_{\rm Hopf}' sections/A2_m47_controlled_w_instrument_proofs.md; then exit 1; fi
          if rg -n -F '\varepsilon_{170}^{\rm in}' sections/A2_m47_controlled_w_instrument_proofs.md; then exit 1; fi
          if rg -n -F '\lambda_{\rm prep}(t)' sections/06_m37_spatial_envelope.md; then exit 1; fi
          if rg -n -F '\Phi_c^{t_{\rm cut}}' sections/06_m37_spatial_envelope.md; then exit 1; fi
          if rg -n -F 'R164--R190--R179--R170' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md; then exit 1; fi
          echo '--- remaining R181A/R170/Hopf references for manual audit ---'
          rg -n 'R181A|R170|Hopf|R192|振幅再調整' sections README.md PROJECT_STATUS.md || true

      - name: Install verification dependencies
        run: python -m pip install numpy

      - name: Compile and verify sources
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          python tools/verify_r192_radial_stabilizer.py
          git diff --check

      - name: Install paper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Rebuild paper including PDF
        run: python tools/build_paper.py

      - name: Check generated paper text
        shell: bash
        run: |
          set -euo pipefail
          pdftotext paper.pdf /tmp/paper.txt
          if rg -n -F '振幅再調整用接続端' /tmp/paper.txt; then exit 1; fi
          if rg -n -F '設定先行2端Hopf受信機構' /tmp/paper.txt; then exit 1; fi
          if rg -n -F 'ε_Hopf' /tmp/paper.txt; then exit 1; fi
          pdfinfo paper.pdf | sed -n '1,20p'

      - name: Upload final PDF for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: r192-paper-final
          path: paper.pdf

      - name: Remove one-shot helpers
        run: |
          rm -f tools/_finalize_r192_retirement_once.py
          rm -f .github/workflows/r192_finalize_once.yml

      - name: Commit final cleanup and regenerated paper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: complete R181A retirement and rebuild paper'
          git push origin HEAD:draft-r192-r181a-retirement
