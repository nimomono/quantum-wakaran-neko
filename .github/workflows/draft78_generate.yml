name: draft-78 generated artifacts

on:
  push:
    branches:
      - draft-78-blackbox-operational-r186
    paths-ignore:
      - paper.md
      - main.tex
      - paper.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-78-blackbox-operational-r186
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: verify and build
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script"; done
          python tools/build_paper.py
          git diff --check
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then exit 1; fi
          pdfinfo paper.pdf | grep '^Pages:'
      - name: commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "draft-78: regenerate paper artifacts after framing fix [generated]"
          git push origin HEAD:draft-78-blackbox-operational-r186
