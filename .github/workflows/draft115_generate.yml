name: draft-115 generate paper

on:
  push:
    branches:
      - draft-115-m0-open-device-criterion

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: draft-115-m0-open-device-criterion

      - run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate canonical paper artifacts
        run: |
          python tools/build_paper.py --output-dir build/draft115
          cp build/draft115/paper.md paper.md
          cp build/draft115/main.tex main.tex
          cp build/draft115/paper.pdf paper.pdf

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "generated artifacts already synchronized"
            exit 0
          fi
          git commit -m "draft-115: regenerate paper artifacts"
          git push origin HEAD:draft-115-m0-open-device-criterion
