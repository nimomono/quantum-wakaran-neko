name: R191改訂生成

on:
  push:
    branches:
      - docs/r191-brownian-macrospin-instrument

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: R191改訂を適用
        run: python tools/apply_r191_revision.py

      - name: R191追加文の用語を正規化
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("README.md"),
              Path("PROJECT_STATUS.md"),
              Path("PROJECT_STANCE.md"),
              Path("CHANGELOG.md"),
              *sorted(Path("sections").glob("*.md")),
          ]
          replacements = {
              "可逆な枝分け": "可逆な経路分解",
              "射影branch": "射影成分",
              "branch作用": "成分作用",
              "非規格化branch": "非規格化成分",
              "補branch": "補成分",
              "active branch": "能動成分",
              "そのbranch自身": "その成分自身",
              "active signal": "能動信号",
              "noise floor": "雑音下限",
          }
          changed = []
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))
          print("terminology-normalized:", ", ".join(changed) if changed else "none")
          PY

      - name: Python構文を検査
        run: |
          python -m py_compile tools/*.py
          test -f tools/verify_terminology.py

      - name: verify_common_canonical_control
        run: python tools/verify_common_canonical_control.py
      - name: verify_common_matching_open_jump
        run: python tools/verify_common_matching_open_jump.py
      - name: verify_envelope_reduction
        run: python tools/verify_envelope_reduction.py
      - name: verify_m37_w_q1_bridge
        run: python tools/verify_m37_w_q1_bridge.py
      - name: verify_m37_w_spectral_tunneling
        run: python tools/verify_m37_w_spectral_tunneling.py
      - name: verify_m47_action_shell_origin
        run: python tools/verify_m47_action_shell_origin.py
      - name: verify_m47_hopf_preparation
        run: python tools/verify_m47_hopf_preparation.py
      - name: verify_m47_q1_instrument
        run: python tools/verify_m47_q1_instrument.py
      - name: verify_m54_q2_composition
        run: python tools/verify_m54_q2_composition.py
      - name: verify_m54_spatial_matching
        run: python tools/verify_m54_spatial_matching.py
      - name: verify_m54_static_instrument
        run: python tools/verify_m54_static_instrument.py
      - name: verify_phase_correlation
        run: python tools/verify_phase_correlation.py
      - name: verify_q1_live_zeno
        run: python tools/verify_q1_live_zeno.py
      - name: verify_q1xq1_common_bath
        run: python tools/verify_q1xq1_common_bath.py
      - name: verify_q2_shell_and_locality
        run: python tools/verify_q2_shell_and_locality.py
      - name: verify_q3_completion
        run: python tools/verify_q3_completion.py
      - name: verify_r179_m54_supply
        run: python tools/verify_r179_m54_supply.py
      - name: verify_r180_bell_cycle
        run: python tools/verify_r180_bell_cycle.py
      - name: verify_r180_m54_receiver
        run: python tools/verify_r180_m54_receiver.py
      - name: verify_r181a_template_port
        run: python tools/verify_r181a_template_port.py
      - name: verify_r181d_projector_tree
        run: python tools/verify_r181d_projector_tree.py
      - name: verify_r186_m54_projective_robustness
        run: python tools/verify_r186_m54_projective_robustness.py
      - name: verify_r187_m37_w_q1_bridge
        run: python tools/verify_r187_m37_w_q1_bridge.py
      - name: verify_r190_drude_shell
        run: python tools/verify_r190_drude_shell.py
      - name: verify_r191_macrospin
        run: python tools/verify_r191_macrospin.py
      - name: verify_terminology
        run: python tools/verify_terminology.py

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物とPDFを確認
        run: |
          git diff --check
          test -s paper.md
          test -s main.tex
          test -s paper.pdf
          pdfinfo paper.pdf | grep -E 'Pages|Page size|File size'
          pdftotext paper.pdf - > /tmp/paper.txt
          test -s /tmp/paper.txt
          git status --short
          git ls-files --others --exclude-standard

      - name: 一時生成器を除去してpush
        run: |
          rm -f tools/apply_r191_revision.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "draft-88: R191ブラウン巨視的スピン射影読出しを統合"
          git push origin HEAD:docs/r191-brownian-macrospin-instrument
