name: R191改訂生成

on:
  push:
    branches:
      - docs/r191-brownian-macrospin-instrument

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: R191改訂を適用
        run: python tools/apply_r191_revision.py

      - name: Python構文と専用検算
        run: |
          python -m py_compile tools/*.py
          python tools/verify_r191_macrospin.py

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 通常CI相当の検算
        run: |
          for script in \
            tools/verify_experiment_bounds.py \
            tools/verify_iti_density.py \
            tools/verify_m47_controlled_w.py \
            tools/verify_m54_q2_suite.py \
            tools/verify_m54_uniform_register.py \
            tools/verify_m54_source_receiver.py \
            tools/verify_uniform_supply.py \
            tools/verify_projector_tree_receiver.py \
            tools/verify_resource_audit.py \
            tools/verify_action_shell_state_count.py \
            tools/verify_absorbing_pointer.py \
            tools/verify_retry_renewal.py \
            tools/verify_r190_drude_shell.py \
            tools/verify_r191_macrospin.py \
            tools/verify_m54_magnet.py \
            tools/verify_open_bath.py \
            tools/verify_pairing_scale_laws.py \
            tools/verify_parser_overgeneralization.py \
            tools/verify_classical_limit.py \
            tools/verify_hopf_preparation.py \
            tools/verify_q3_energy_response.py \
            tools/verify_spherical_transport.py \
            tools/verify_thermal_equilibrium.py \
            tools/verify_no_signaling.py \
            tools/verify_timing_contracts.py \
            tools/verify_w_hamiltonian_reduction.py \
            tools/verify_m47_w_bell.py; do
            python "$script"
          done
          for script in \
            bell_finite_time_checks.py \
            verify_d_min_scaling.py \
            verify_projector_kernel.py \
            verify_contextuality_bound.py \
            verify_circuit_resource_bounds.py \
            verify_canonical_overlap.py \
            q3_projection_bound.py; do
            test -f "$script"
            python "$script"
          done
          git diff --check
          pdfinfo paper.pdf | grep -E 'Pages|Page size|File size'
          git status --short
          git ls-files --others --exclude-standard

      - name: 一時生成器を除去してpush
        run: |
          rm -f tools/apply_r191_revision.py .github/workflows/r191_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "draft-88: R191ブラウン巨視的スピン射影読出しを統合"
          git push origin HEAD:docs/r191-brownian-macrospin-instrument
