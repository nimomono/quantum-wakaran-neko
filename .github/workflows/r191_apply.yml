name: R191生成物引渡し

on:
  push:
    branches:
      - docs/r191-brownian-macrospin-instrument

permissions:
  contents: read

jobs:
  build-and-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: R191改訂を適用
        run: python tools/apply_r191_revision.py

      - name: R191追加文の用語を正規化
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("README.md"), Path("PROJECT_STATUS.md"),
              Path("PROJECT_STANCE.md"), Path("CHANGELOG.md"),
              *sorted(Path("sections").glob("*.md")),
          ]
          replacements = {
              "可逆な枝分け": "可逆な経路分解",
              "射影branch": "射影成分",
              "branch作用": "成分作用",
              "非規格化branch": "非規格化成分",
              "補branch": "補成分",
              "active branch": "能動成分",
              "そのbranch自身": "その成分自身",
              "active signal": "能動信号",
              "noise floor": "雑音下限",
          }
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding="utf-8")
          PY

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物を確認
        run: |
          python tools/verify_r191_macrospin.py
          python tools/verify_terminology.py
          git diff --check
          test -s paper.md
          test -s main.tex
          test -s paper.pdf
          pdfinfo paper.pdf | grep -E 'Pages|Page size|File size'
          pdftotext paper.pdf - > /tmp/paper.txt
          test -s /tmp/paper.txt

      - name: 引渡しbundleを作成
        run: |
          rm -f tools/apply_r191_revision.py
          rm -rf /tmp/r191-handoff
          mkdir -p /tmp/r191-handoff/files
          printf '%s\n' "$GITHUB_SHA" > /tmp/r191-handoff/base_sha.txt
          git diff --name-status "$GITHUB_SHA" > /tmp/r191-handoff/name_status.txt
          git diff --name-only --diff-filter=D "$GITHUB_SHA" > /tmp/r191-handoff/deleted.txt
          git diff --name-only --diff-filter=ACMRT "$GITHUB_SHA" > /tmp/r191-handoff/changed.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "/tmp/r191-handoff/files/$(dirname "$path")"
            cp -a "$path" "/tmp/r191-handoff/files/$path"
          done < /tmp/r191-handoff/changed.txt
          tar -C /tmp/r191-handoff -czf /tmp/r191-handoff.tgz .
          cat /tmp/r191-handoff/name_status.txt

      - name: 生成物をartifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: r191-generated-handoff
          path: /tmp/r191-handoff.tgz
          if-no-files-found: error
          retention-days: 1
