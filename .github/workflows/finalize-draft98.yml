name: finalize-draft98

on:
  push:
    branches:
      - draft-98-m57-ballistic-moving-bath
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-98-m57-ballistic-moving-bath
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install numpy

      - name: Normalize migration script
        run: |
          python - <<'PY'
          from pathlib import Path
          # Normalize one already-corrected symbol so the asserted migration stays deterministic.
          p = Path('sections/A22_m57_dual_tl_tracer_microphysics.md')
          t = p.read_text(encoding='utf-8')
          old = r'\nu_{\rm eff}=g_KU_e'
          new = r'u_{\rm eff}=g_KU_e'
          if old not in t and new in t:
              p.write_text(t.replace(new, old, 1), encoding='utf-8')

          # Treat LaTeX replacement strings literally in regex substitutions.
          p = Path('tools/apply_draft98_m57_ballistic.py')
          t = p.read_text(encoding='utf-8')
          old_line = '    new, count = re.subn(pattern, repl, text, count=1, flags=flags)'
          new_line = '    new, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=flags)'
          if old_line not in t:
              raise SystemExit('replace_regex_once implementation marker missing')
          t = t.replace(old_line, new_line, 1)
          old_line = '    text, n = re.subn(pattern, r"\\1R196C\\2", text, count=1, flags=re.MULTILINE)'
          new_line = '    text, n = re.subn(pattern, lambda m: m.group(1) + "R196C" + m.group(2), text, count=1, flags=re.MULTILINE)'
          if old_line not in t:
              raise SystemExit('enhancement back-reference marker missing')
          p.write_text(t.replace(old_line, new_line, 1), encoding='utf-8')
          PY

      - name: Apply synchronized source edits
        run: python tools/apply_draft98_m57_ballistic.py

      - name: Source and physics checks
        run: |
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate paper
        run: |
          python tools/build_paper.py --output-dir build/draft98
          cp build/draft98/paper.md paper.md
          cp build/draft98/main.tex main.tex
          cp build/draft98/paper.pdf paper.pdf
          git diff --check

      - name: Remove temporary migration files
        run: |
          rm tools/apply_draft98_m57_ballistic.py
          rm .github/workflows/finalize-draft98.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'draft-98: replace M57 with ballistic moving-bath model'
          git push origin HEAD:draft-98-m57-ballistic-moving-bath
