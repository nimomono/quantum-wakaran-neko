name: draft-110 generated sync

on:
  push:
    branches:
      - draft-110-retire-m63
    paths-ignore:
      - paper.md
      - main.tex
      - paper.pdf

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 組版依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "draft-110: regenerate paper"
          git push origin HEAD:draft-110-retire-m63
