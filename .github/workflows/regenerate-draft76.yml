name: draft-76 artifact regeneration

on:
  push:
    branches:
      - draft-76-q1-theorem-hierarchy

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: draft-76-q1-theorem-hierarchy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: Run numerical and structural checks
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do
            python "$script"
          done

      - name: Regenerate manuscript artifacts
        run: python tools/build_paper.py

      - name: Check generated PDF
        run: |
          test -s paper.pdf
          pdfinfo paper.pdf
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then
            exit 1
          fi
          git diff --check

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if ! git diff --cached --quiet; then
            git commit -m "draft-76: regenerate paper artifacts [generated]"
            git push origin HEAD:draft-76-q1-theorem-hierarchy
          fi
