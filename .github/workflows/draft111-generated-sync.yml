name: draft-111 generated sync

on:
  push:
    branches:
      - draft-111-complete-m64-bridges

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[generated-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-111-complete-m64-bridges
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - run: python tools/build_paper.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "generated files already synchronized"
            exit 0
          fi
          git commit -m "draft-111: regenerate paper artifacts [generated-sync]"
          git push origin HEAD:draft-111-complete-m64-bridges
