name: draft-113 generated sync

on:
  push:
    branches:
      - draft-113-post-m64-consistency-cleanup

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate paper artifacts
        run: python tools/build_paper.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
          else
            git commit -m "draft-113: regenerate paper artifacts [generated-sync]"
            git push
          fi
