name: R191主線圧縮 one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: Apply simplification migration
        run: |
          # Correct one-shot source issues before execution; the migration script is removed from the final tree.
          sed -i 's/t = p.read_text(encoding="utf-8")nt = t.replace/t = p.read_text(encoding="utf-8")\nt = t.replace/' tools/apply_r191_simplification.py
          sed -i 's/out, n = re.subn(pattern, row, text, count=1)/out, n = re.subn(pattern, lambda _m: row, text, count=1)/' tools/apply_r191_simplification.py
          python - <<'PY'
          from pathlib import Path
          p = Path("tools/apply_r191_simplification.py")
          s = p.read_text(encoding="utf-8")
          old = '''t = sub_required(
              t,
              r"\\n### 2\\.8\\.1 R190A--R190C：.*?(?=\\n### 2\\.8\\.2 R191：)",
              "\\n",
              flags=re.S,
          )'''
          new = '''_r190_start = t.find("\\n### 2.8.1 R190")
          _r191_start = t.find("\\n### 2.8.2 R191", _r190_start + 1)
          if _r190_start < 0 or _r191_start < 0:
              raise RuntimeError("R190/R191 section boundary not found")
          t = t[:_r190_start] + "\\n" + t[_r191_start:]'''
          if old not in s:
              raise SystemExit("one-shot R190 replacement block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile tools/apply_r191_simplification.py
          python tools/apply_r191_simplification.py

      - name: Verify and regenerate paper
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script"; done
          python tools/build_paper.py
          git diff --check
          pdfinfo paper.pdf | head -20

      - name: Commit generated simplification
        run: |
          rm -f tools/apply_r191_simplification.py .github/workflows/r191_simplify_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "draft-89: R191主線へ圧縮し旧静的選択経路を退役"
          git push origin HEAD:${{ github.head_ref }}
