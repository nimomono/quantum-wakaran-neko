name: draft-74 regenerate artifacts

on:
  push:
    branches:
      - draft-74-unified-matching-m54

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-74-unified-matching-m54
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Verify and regenerate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script" >/dev/null; done
          python tools/build_paper.py
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then
            exit 1
          fi
      - name: Commit generated files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if ! git diff --cached --quiet; then
            git commit -m "draft-74: regenerate clean manuscript artifacts"
            git push origin HEAD:draft-74-unified-matching-m54
          fi
