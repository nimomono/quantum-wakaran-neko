name: draft-84 生成物更新

on:
  push:
    branches:
      - draft84-q3-2-nelson-collision-closure

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft84-q3-2-nelson-collision-closure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: 検算と生成
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script"; done
          python tools/build_paper.py
          git diff --check
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then
            exit 1
          fi
          pdfinfo paper.pdf | grep -E '^(Pages|Page size):'

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf MANIFEST.md
          if git diff --cached --quiet; then
            echo "生成物は同期済み"
            exit 0
          fi
          git commit -m "draft-84: regenerate paper and PDF"
          git push origin HEAD:draft84-q3-2-nelson-collision-closure
