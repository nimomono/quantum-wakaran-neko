name: draft-97 finalizer

on:
  push:
    branches:
      - draft-97-enhancement-policy-sync

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: draft-97-enhancement-policy-sync
          lfs: true
          fetch-depth: 0

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numeric dependency
        run: python -m pip install numpy

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Apply draft-97 policy sync
        run: python tools/finalize_draft97.py

      - name: Check Python syntax
        run: python -m compileall -q tools

      - name: Check source contracts
        run: python tools/check_source.py

      - name: Self-check validation policy
        run: python tools/test_validation_policy.py

      - name: Lint terminology
        run: python tools/check_terminology.py

      - name: Run physics checks
        run: python tools/run_physics_checks.py

      - name: Build canonical paper
        run: python tools/build_paper.py

      - name: Build isolated comparison copy
        run: python tools/build_paper.py --output-dir build/ci

      - name: Check generated artifacts
        run: python tools/check_generated.py build/ci

      - name: Lint typesetting log
        run: python tools/lint_typeset.py build/ci/latex/main.log

      - name: Check diff whitespace
        run: git diff --check

      - name: Commit synchronized sources and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "draft-97: sync enhancement policy and Bell audit"
          git push origin HEAD:draft-97-enhancement-policy-sync
