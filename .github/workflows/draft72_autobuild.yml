name: draft-72 one-shot artifact rebuild

on:
  push:
    branches:
      - draft-72-m55-moving-matching

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-72-m55-moving-matching
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: validate and rebuild
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do python "$script"; done
          python tools/build_paper.py
          ! grep -Eq "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log
          pdftotext -layout paper.pdf /tmp/paper.txt
          pdfinfo paper.pdf
      - name: commit artifacts and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          git rm .github/workflows/draft72_autobuild.yml
          git commit -m "draft-72: rebuild final manuscript and remove one-shot workflow"
          git push origin HEAD:draft-72-m55-moving-matching
