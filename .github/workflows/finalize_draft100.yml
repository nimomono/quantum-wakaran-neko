name: finalize-draft100

on:
  push:
    branches:
      - draft-100-r161-path-law

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-100-r161-path-law
          lfs: true
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source edits
        shell: bash
        run: |
          set +e
          python tools/finalize_draft100.py > draft100-finalizer.log 2>&1
          code=$?
          cat draft100-finalizer.log
          if [ $code -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add draft100-finalizer.log
            git commit -m 'draft-100: capture finalizer failure'
            git push origin HEAD:draft-100-r161-path-law
            exit $code
          fi
          rm draft100-finalizer.log

      - name: Dependencies
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Source checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: Rebuild paper
        run: |
          python tools/build_paper.py --output-dir build/draft100
          cp build/draft100/paper.md paper.md
          cp build/draft100/main.tex main.tex
          cp build/draft100/paper.pdf paper.pdf
          python tools/check_generated.py build/draft100
          python tools/lint_typeset.py build/draft100/latex/main.log
          git diff --check

      - name: Remove temporary finalizer
        run: |
          rm tools/finalize_draft100.py
          rm .github/workflows/finalize_draft100.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'draft-100: move canonical Markov path law into R161'
          git push origin HEAD:draft-100-r161-path-law
