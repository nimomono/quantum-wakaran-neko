name: finalize-draft100

on:
  push:
    branches:
      - draft-100-r161-path-law

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-100-r161-path-law
          lfs: true
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch finalizer replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/finalize_draft100.py')
          text = path.read_text(encoding='utf-8')
          old = 'new, count = re.subn(pattern, repl, text, count=1, flags=flags)'
          new = 'new, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=flags)'
          if text.count(old) != 1:
              raise SystemExit('regex helper patch target missing or duplicated')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply source edits
        run: python tools/finalize_draft100.py

      - name: Dependencies
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Source checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: Rebuild paper
        run: |
          python tools/build_paper.py --output-dir build/draft100
          cp build/draft100/paper.md paper.md
          cp build/draft100/main.tex main.tex
          cp build/draft100/paper.pdf paper.pdf
          python tools/check_generated.py build/draft100
          python tools/lint_typeset.py build/draft100/latex/main.log
          git diff --check

      - name: Remove temporary finalizer
        run: |
          rm tools/finalize_draft100.py
          rm .github/workflows/finalize_draft100.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'draft-100: move canonical Markov path law into R161'
          git push origin HEAD:draft-100-r161-path-law
