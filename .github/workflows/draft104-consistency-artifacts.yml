name: draft104-consistency-artifacts

on:
  push:
    branches:
      - draft-104-m60-consistency-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python checks
        run: |
          python -m pip install numpy
          python tools/migrations/draft104_m60_consistency.py
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/run_physics_checks.py
          python tools/run_physics_checks.py --include-candidate
      - name: TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - name: Build
        run: python tools/build_paper.py --output-dir build/draft104
      - name: LaTeX semantics
        run: python tools/check_latex_semantics.py build/draft104/latex/main.log
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draft104-generated
          path: |
            build/draft104/paper.md
            build/draft104/main.tex
            build/draft104/paper.pdf
            build/draft104/latex/main.log
