name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  source-check:
    name: 原稿構造
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python構文を検査
        run: python -m compileall -q tools

      - name: 原稿構造を検査
        if: ${{ always() }}
        run: python tools/check_source.py

      - name: 検算方針を自己検査
        if: ${{ always() }}
        run: python tools/test_validation_policy.py

      - name: 用語をlint
        if: ${{ always() }}
        run: python tools/check_terminology.py

      - name: 差分形式を検査
        if: ${{ always() }}
        run: git diff --check

  physics-check:
    name: 数式・数値
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数値依存を導入
        run: python -m pip install numpy

      - name: 数式と数値を検算
        run: python tools/run_physics_checks.py

  paper-check:
    name: 論文生成
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 組版依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: 隔離ディレクトリへ論文を再生成
        run: python tools/build_paper.py --output-dir build/ci

      - name: 生成物の同期を検査
        run: python tools/check_generated.py build/ci

      - name: 組版警告をlint
        run: python tools/lint_typeset.py build/ci/latex/main.log

      - name: 標準構成を検査
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
          git diff --check
