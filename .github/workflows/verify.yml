name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  source-check:
    name: 原稿構造
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python構文を検査
        run: python -m compileall -q tools

      - name: 原稿構造を検査
        if: ${{ always() }}
        run: python tools/check_source.py

      - name: 履歴・依存整合を検査
        if: ${{ always() }}
        run: python tools/check_project_consistency.py

      - name: 検算方針を自己検査
        if: ${{ always() }}
        run: python tools/test_validation_policy.py

      - name: 用語をlint
        if: ${{ always() }}
        run: python tools/check_terminology.py

      - name: 差分形式を検査
        if: ${{ always() }}
        run: git diff --check

  physics-check:
    name: 数式・数値
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数値依存を導入
        run: python -m pip install numpy

      - name: required数式・数値を検算
        run: python tools/run_physics_checks.py

  paper-check:
    name: 論文生成
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 組版依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: 隔離ディレクトリへ論文を再生成
        id: build
        run: python tools/build_paper.py --output-dir build/ci

      - name: PR生成物を一時保存
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: draft145-generated-paper
          path: |
            build/ci/paper.md
            build/ci/main.tex
            build/ci/paper.pdf
          if-no-files-found: error

      - name: draft-145生成物をbranchへ同期
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'draft-145-r214-q3-promotion' && steps.build.outcome == 'success' }}
        run: |
          cp build/ci/paper.md /tmp/draft145-paper.md
          cp build/ci/main.tex /tmp/draft145-main.tex
          cp build/ci/paper.pdf /tmp/draft145-paper.pdf
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" FETCH_HEAD
          cp /tmp/draft145-paper.md paper.md
          cp /tmp/draft145-main.tex main.tex
          cp /tmp/draft145-paper.pdf paper.pdf
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "generated artifacts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "draft-145: sync generated paper artifacts"
          git push origin HEAD:"${GITHUB_HEAD_REF}"

      - name: 生成物の同期を検査
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/check_generated.py build/ci

      - name: LaTeX重大異常を検査
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/check_latex_semantics.py build/ci/latex/main.log

      - name: 組版警告をlint
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: python tools/lint_typeset.py build/ci/latex/main.log

      - name: 標準構成を検査
        if: ${{ always() }}
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
          git diff --check
