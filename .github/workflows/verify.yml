name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: 数式と数値を検算
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do
            python "$script"
          done

      - name: 現行の理論階層統合を検査
        run: |
          set -Ee -o pipefail
          trap 'rc=$?; echo "::error::理論階層統合の失敗 (exit ${rc}): ${BASH_COMMAND}"' ERR
          test -f sections/A6_common_signal_statistics.md
          test -f sections/A8_m47_hopf_preparation.md
          test -f sections/A9_m48_paired_hopf_bell_preparation.md
          test -f sections/A10_q2_joint_bath_contract.md
          test -f sections/A11_common_collision_bath_thermodynamics.md
          test -f sections/A12_common_action_shell_state_count.md
          test -f sections/A13_common_open_preparation.md
          test -f sections/A14_m37_m42_spatial_token.md
          test -f notes/q1_2_zeno_integration.md
          test ! -e notes/q1_zeno_revival.md
          test ! -e notes/frozen_q1_zeno.md
          test ! -e sections/A6_m37_m50_position_instrument_proofs.md
          test ! -e sections/A8_w_two_mode_hopf_statistics.md
          test ! -e sections/A13_q2_action_shell_statistics.md
          test ! -e sections/A8_open_quasicritical_preparation.md
          test ! -e sections/A14_q2_action_shell_statistics.md
          test ! -d simulations/m45_open_quasicritical
          test ! -e figures/m45_open_trap_diagnostics.png
          test ! -e figures/m45_conditional_ground_comparison.png
          test -f tools/verify_common_canonical_control.py
          test -f tools/verify_common_collision_thermodynamics.py
          test -f tools/verify_common_signal_m50.py
          test -f tools/verify_m51_common_open_preparation.py
          test -f tools/verify_m42_spatial_token.py
          test -f tools/verify_q2_shell_and_locality.py
          test ! -e tools/verify_action_distribution.py
          test ! -e tools/verify_m37_m50_position_instrument.py
          test ! -e tools/verify_m50_instrument_and_q3_handoff.py
          test ! -e tools/verify_q2_action_shell_integration.py
          test ! -e tools/verify_m39_m48_ablation.py
          grep -Fq 'R135：有限信号集団の規格化第2モーメント輸送' sections/02_common_canonical_modules.md
          grep -Fq 'R171：M51共通開放ray準備の有限時間率と切断後輸送' sections/02_common_canonical_modules.md
          grep -Fq 'R168：一般ray平均からM50枝統計への受渡し' sections/02_common_canonical_modules.md
          grep -Fq 'R170：M50固定入力時刻有限枝instrument' sections/02_common_canonical_modules.md
          grep -Fq 'R143：M47有限コントラスト読出しと結果別状態更新' sections/03_m47_controlled_w_instrument.md
          grep -Fq 'R155：M48完全Bell周期、有限誤差、局所性監査、帰還' sections/05_m48_bell_cycle_and_audit.md
          grep -Fq 'R86：M37有限時間包絡線縮約' sections/06_m37_spatial_envelope.md
          grep -Fq 'R172：M37有効辺流に沿うM42局在トークンの等変輸送' sections/06_m37_spatial_envelope.md
          grep -Fq 'R173：M42の節一様正則化と有限衝突Hamiltonian近似' sections/06_m37_spatial_envelope.md
          grep -Fq 'R174：M51--M37--M42の有限時間準備・輸送・記録受渡し' sections/06_m37_spatial_envelope.md
          grep -Fq 'R162の平衡率公式をそのまま用いる主張ではない' sections/06_m37_spatial_envelope.md
          grep -Fq '方向別controllerと仕事registerを持つ駆動衝突模型' sections/A14_m37_m42_spatial_token.md
          grep -Fq '物理的な一様閾値座標' sections/A14_m37_m42_spatial_token.md
          grep -Fq 'R112 | 厳密結果 | 有限正準信号のunitary合成' PROJECT_STATUS.md
          grep -Fq 'M50 | 有限信号作用・作用殻・粒子位置熱化・有限枝instrument | 現行共通instrument仕様' PROJECT_STATUS.md
          grep -Fq 'M51 | 有限実正準担体の共通開放ray準備 | 現行基礎開放模型' PROJECT_STATUS.md
          grep -Fq 'M42 | M37空間担体上の局在1粒子トークン | 現行Q3粒子模型' PROJECT_STATUS.md
          grep -Fq 'R159：固定有限入力、入力頻度、固定積出力基底の共同入力--出力統計' sections/04_l4_two_qubit_gate.md
          grep -Fq '| Q1-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 射影測定統計とZeno効果 |' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 射影測定統計とZeno効果 |' README.md
          grep -Fq '同軸再測定の反復分布' PROJECT_STATUS.md
          grep -Fq '異なる軸による逐次測定分布' PROJECT_STATUS.md
          if grep -En '^\| Q1-(3|4) \|' README.md PROJECT_STATUS.md sections/*.md; then
            exit 1
          fi
          grep -Fq '| Q2-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-2 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-3 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-4 | 未達 |' PROJECT_STATUS.md
          grep -Fq '| Q2-5 | 未達 |' PROJECT_STATUS.md
          grep -Fq '| Q3-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-2 | 未達 |' PROJECT_STATUS.md
          grep -Fq '| Q3-3 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-4 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-5 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-3 | 有限回路の機能的再現 |' PROJECT_STATUS.md
          grep -Fq '| Q2-4 | 多項式資源による量子出力サンプリング |' PROJECT_STATUS.md
          grep -Fq '| Q2-5 | 自律非平衡計算と平衡化運命の決定不能性 |' PROJECT_STATUS.md
          grep -Fq '積入力を非分離な共同内部状態へ移し得る' PROJECT_STATUS.md
          grep -Fq '最終出力分布を事前計算' PROJECT_STATUS.md
          grep -Fq '一出力標本' PROJECT_STATUS.md
          grep -Fq '長時間極限の後に熱力学極限' PROJECT_STATUS.md
          grep -Fq '成功試行だけを再規格化しない' sections/08_errors_resources_open_targets.md
          grep -Fq 'Q2-3有限回路の機能的再現' sections/08_errors_resources_open_targets.md
          grep -Fq 'Q2-3を条件付き達成' sections/08_errors_resources_open_targets.md
          grep -Fq 'Q2-4多項式資源による量子出力サンプリング' sections/08_errors_resources_open_targets.md
          grep -Fq 'Q2-5自律非平衡計算と平衡化運命の決定不能性' sections/08_errors_resources_open_targets.md
          grep -Fq '白石と松本' sections/08_errors_resources_open_targets.md
          grep -Fq '有限時間で非停止を判定' sections/08_errors_resources_open_targets.md
          grep -Fq '積入力から非分離な共同内部状態への写像' PROJECT_STATUS.md
          if grep -REn '未達（凍結中）|未達・凍結|未達のまま凍結|凍結状態|凍結を維持' README.md PROJECT_STATUS.md sections/*.md; then
            exit 1
          fi
          if grep -REn 'R(83|84|85|87|88|89|90|97|98|99|104|105|106|136|139|141|142|146|148|149|150|151|152|154|156|157|158|163|165|166|167|169)|M(35|39|41|43|45|46)|R(107|108|109|110|111|120|121|122|130|131|132|137|138)' README.md PROJECT_STATUS.md sections/*.md tools/*.py; then
            exit 1
          fi
          test "$(grep -Rho '定理（R161：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R171：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R172：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R173：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R174：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R162：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R164：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R123：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R124：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R125：' sections/*.md | wc -l)" -eq 1
          if grep -REn 'A14_q2|A13_q2|A12_common_collision|A11_q2|A10_m48|A9_w_two|A8_w_two|A6_m37_m50' MANIFEST.md tools/verify_*.py; then
            exit 1
          fi
          if grep -REn '二mode|二モード|実現配置' README.md PROJECT_STATUS.md sections/*.md; then
            exit 1
          fi

      - name: 収録PDFを退避
        run: cp paper.pdf /tmp/paper-committed.pdf

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物の同期を検査
        run: |
          git diff --exit-code -- paper.md main.tex paper.pdf
          pdftotext -layout /tmp/paper-committed.pdf /tmp/paper-committed.txt
          pdftotext -layout paper.pdf /tmp/paper-regenerated.txt
          diff -u /tmp/paper-committed.txt /tmp/paper-regenerated.txt
          test "$(pdfinfo /tmp/paper-committed.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')"
          test "$(pdfinfo /tmp/paper-committed.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')" = "$(pdfinfo paper.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')"
          ! grep -Eq "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log

      - name: 標準構成を検査
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
          git diff --check
