name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install -r simulations/m45_open_quasicritical/requirements.txt

      - name: 数式と数値を検算
        run: |
          python -m py_compile tools/*.py simulations/m45_open_quasicritical/m45/*.py simulations/m45_open_quasicritical/*.py
          python tools/verify_envelope_reduction.py
          python tools/verify_phase_correlation.py
          python tools/verify_action_distribution.py
          python tools/verify_m47_q1_instrument.py
          python tools/verify_m47_hopf_preparation.py
          python tools/verify_q2_1_gate.py
          python tools/verify_m48_paired_hopf.py
          python tools/verify_m48_full_cycle.py
          python tools/verify_realized_configuration.py
          python tools/verify_q3_completion.py
          python simulations/m45_open_quasicritical/verify.py --quick

      - name: draft-45B移行と表記を検査
        run: |
          test -f sections/03_m47_controlled_w_instrument.md
          test -f sections/A2_m47_controlled_w_instrument_proofs.md
          test -f sections/A9_w_two_mode_hopf_statistics.md
          test -f sections/A10_m48_paired_hopf_bell_preparation.md
          test -f tools/verify_m47_q1_instrument.py
          test -f tools/verify_m47_hopf_preparation.py
          test -f tools/verify_m48_paired_hopf.py
          test -f tools/verify_m48_full_cycle.py
          test -f sections/05_m48_bell_cycle_and_audit.md
          test -f sections/A4_m48_cycle_proofs.md
          test -f notes/superseded_m41_bell_cycle.md
          test -f notes/superseded_m41_cycle_proofs.md
          test ! -e sections/05_m41_bell_cycle_and_audit.md
          test ! -e sections/A4_m41_cycle_proofs.md
          test ! -e tools/verify_q2_2_m41.py
          test ! -e sections/03_l2_operation_measurement_zeno.md
          test ! -e sections/A2_l2_cycle_and_zeno_proofs.md
          test ! -e tools/verify_l2_cycle.py
          test ! -e tools/verify_l2_zeno.py
          grep -Fq '| Q1-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-3 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-4 | 未達（凍結中） |' PROJECT_STATUS.md
          grep -Fq '| Q2-2 | 条件付き達成 | R146--R156 |' PROJECT_STATUS.md
          ! grep -Fq '| Q2-2 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| M41 | 初期共通原因型2端Bell測定周期 | 置換済みモデル |' PROJECT_STATUS.md
          grep -Fq '| M48 | 設定依存paired-Hopf初期共通原因Bell周期模型 | 現行Q2-2モデル |' PROJECT_STATUS.md
          grep -Fq 'Q1、Q2-1、Q2-3、Q3の現在地は変更しない。' PROJECT_STATUS.md
          grep -Fq 'M42/R113またはcurrent transducerを使わない' sections/03_m47_controlled_w_instrument.md
          grep -Fq 'R151--R156' sections/01_scope_and_cycle.md
          grep -Fq 'R151--R154' sections/A10_m48_paired_hopf_bell_preparation.md
          grep -Fq 'R152を具体的ミクロ模型から導出済みと扱う' sections/08_errors_resources_open_targets.md
          ! grep -REn '二mode|二モード' README.md PROJECT_STATUS.md CHANGELOG.md sections notes

      - name: 収録PDFを退避
        run: cp paper.pdf /tmp/paper-committed.pdf

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物の同期を検査
        run: |
          git diff --exit-code -- paper.md main.tex paper.pdf
          pdftotext -layout /tmp/paper-committed.pdf /tmp/paper-committed.txt
          pdftotext -layout paper.pdf /tmp/paper-regenerated.txt
          diff -u /tmp/paper-committed.txt /tmp/paper-regenerated.txt
          test "$(pdfinfo /tmp/paper-committed.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')"
          test "$(pdfinfo /tmp/paper-committed.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')" = "$(pdfinfo paper.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')"
          test "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')" = "190"
          ! grep -Eq "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log

      - name: 標準構成を検査
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
