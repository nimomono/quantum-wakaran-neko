name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: 数式と数値を検算
        run: |
          python -m py_compile tools/*.py
          test -f tools/verify_terminology.py
          for script in tools/verify_*.py; do
            python "$script"
          done

      - name: M54理論境界を検査
        run: |
          set -Ee -o pipefail
          trap 'rc=$?; echo "::error::M54理論境界の失敗 (exit ${rc}): ${BASH_COMMAND}"' ERR
          for path in \
            sections/04_m54_q2_specializations.md \
            sections/05_m54_setting_pre_receiver.md \
            sections/A3_m54_q2_specialization_proofs.md \
            sections/A4_m54_receiver_cycle_proofs.md \
            sections/A9_m54_setting_pre_paired_hopf_receiver.md \
            sections/A13_m54_template_port_preparation.md \
            sections/A15_m54_uniform_register.md \
            sections/A16_m54_projector_tree_receiver.md \
            sections/A17_m54_uniform_supply.md \
            sections/A18_m54_projective_robustness.md \
            sections/A19_m54_drude_action_shell_bridge.md \
            notes/superseded_r178_aperture_sampler.md \
            notes/superseded_separate_m51_m52_m53_models.md \
            tools/verify_r181a_template_port.py \
            tools/verify_r181d_projector_tree.py \
            tools/verify_m54_q2_composition.py \
            tools/verify_r179_m54_supply.py \
            tools/verify_r180_m54_receiver.py; do
            test -f "$path"
          done
          test "$(grep -Rho '定理（R181A：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R181B：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R181C：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R181D：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R186：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R190A：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '補題（R190B：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R190C：' sections/*.md | wc -l)" -eq 1
          grep -Fq '**証明（R186）**' sections/A18_m54_projective_robustness.md
          grep -Fq '## S.13 反復衝突とrenewal条件' sections/A19_m54_drude_action_shell_bridge.md
          test -f tools/verify_r190_drude_shell.py
          grep -Fq '量子力学に特徴的な状態空間、可逆力学、Born型測定統計、測定後状態' sections/01_scope_and_cycle.md
          grep -Fq '全自由度に加わる加法ノイズ' sections/08_errors_resources_open_targets.md
          grep -Fq 'ブラックボックスとしての運用上の複雑度' sections/08_errors_resources_open_targets.md
          grep -Fq '信号作用 $S$ を指数的に増やせば' sections/08_errors_resources_open_targets.md
          test -f tools/verify_r186_m54_projective_robustness.py
          test "$(grep -Rho '定理（R170：' sections/*.md | wc -l)" -eq 1
          grep -Fq '定理（R170：M54静的選択・固定共通定理）' sections/02_common_canonical_modules.md
          grep -Fq '**系（R170選択結果の局所記録）**' sections/02_common_canonical_modules.md
          grep -Fq '定理（R181D：M54段階的射影選別・測定後状態受渡し定理）' sections/02_common_canonical_modules.md
          grep -Fq '共通射影選別機構' sections/02_common_canonical_modules.md
          grep -Fq '固定前に選別機構を開かない' sections/A16_m54_projector_tree_receiver.md
          grep -Fq '## P.5.1 階数1 射影子の測定後状態の受け渡し' sections/A16_m54_projector_tree_receiver.md
          grep -Fq '## P.6 方向を変えない振幅再調整' sections/A16_m54_projector_tree_receiver.md
          grep -Fq 'R181Dの段階的射影選別定理そのものには依存しない' sections/05_m54_setting_pre_receiver.md
          ! grep -R -Fq 'R170駆動' README.md PROJECT_STATUS.md sections
          ! grep -R -Fq 'M54静的選択・固定共通部' README.md PROJECT_STATUS.md sections
          ! grep -R -Fq '\varepsilon_{170}^{\rm end}' README.md PROJECT_STATUS.md sections
          q2_2_deps="$(awk -F'|' '/^\| Q2-2 \| 条件付き達成 \|/ {gsub(/^ +| +$/, "", $7); print $7}' PROJECT_STATUS.md)"
          [[ "$q2_2_deps" != *R181D* ]]
          grep -Fq 'rank_one_post_state_error' tools/verify_r181d_projector_tree.py
          grep -Fq '集約低温誤差' sections/A17_m54_uniform_supply.md
          grep -Fq 'version: "draft-85"' CITATION.cff
          grep -Fq 'draft-85 改訂稿' tools/template.tex


      - name: M54整合理論境界を検査
        run: |
          set -Ee -o pipefail
          trap 'echo "::error::M54整合理論境界の失敗: $BASH_COMMAND"' ERR
          test -f sections/A14_m54_spatial_moving_matching.md
          test ! -e sections/A14_m55_spatial_moving_matching.md
          test -f tools/verify_common_matching_collision.py
          test -f tools/verify_m54_static_instrument.py
          test -f tools/verify_m54_spatial_matching.py
          test ! -e tools/verify_common_collision_thermodynamics.py
          test ! -e tools/verify_common_signal_m50.py
          test ! -e tools/verify_m55_moving_matching.py
          test "$(grep -Rho '定理（R161：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R162：' sections/*.md | wc -l)" -eq 1
          ! grep -Rq '定理（R183：' sections/*.md
          test "$(grep -Rho '定理（R184：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R185：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R188：' sections/*.md | wc -l)" -eq 1
          grep -Fq '| Q3-2 | 達成 | M54空間状態構成 |' PROJECT_STATUS.md
          ! grep -Eq '^\| M50 \||^\| M55 \|' PROJECT_STATUS.md
          ! grep -Eq '^\| M47 \|' PROJECT_STATUS.md sections/01_scope_and_cycle.md
          grep -Fq 'Q1 W型2モード制御手順（旧M47）' PROJECT_STATUS.md
          grep -Fq '## H.3 R181Aへのパラメータ対応' sections/A8_m47_hopf_preparation.md
          ! grep -Fq '<!-- theorem-start:proof -->' sections/A8_m47_hopf_preparation.md
          grep -Fq '## 4.3　R181Bの2入力特殊化' sections/04_m54_q2_specializations.md
          grep -Fq '## 4.4　R181Cの2入力・3入力ゲート適用' sections/04_m54_q2_specializations.md
          grep -Fq '## 3.15 R144：固定有限段逐次測定合成' sections/03_m47_controlled_w_instrument.md
          test "$(grep -Rho '定理（R143：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R144：' sections/*.md | wc -l)" -eq 1
          grep -Fq 'R181Dの階数1の選択後信号' sections/A2_m47_controlled_w_instrument_proofs.md
          grep -Fq '\delta_{{\rm state},j}' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md
          ! grep -Fq '\delta_{{\rm post},j}' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md
          ! grep -Fq '結果別テンプレート交換' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md
          ! grep -Fq '結果別template交換' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md
          ! grep -Fq '結果別テンプレート' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md sections/A8_m47_hopf_preparation.md
          grep -Fq '## 3.12 共通射影選別機構による測定後状態の受け渡し' sections/03_m47_controlled_w_instrument.md
          grep -Fq '測定後状態の受け渡し' sections/A8_m47_hopf_preparation.md
          ! grep -R -Fq 'R170衝突' README.md PROJECT_STATUS.md sections
          grep -Fq '\varepsilon_{Q3-2}' sections/08_errors_resources_open_targets.md
          grep -Fq 'C_{185,a}a^2' sections/08_errors_resources_open_targets.md
          grep -Fq 'C_{\rm time}\tau' sections/08_errors_resources_open_targets.md
          grep -Fq '\varepsilon_{162}^{\rm hist}' sections/08_errors_resources_open_targets.md
          grep -Fq 'R162有限骨格経路TV' sections/08_errors_resources_open_targets.md
          test -f tools/verify_q3_nelson_collision.py
          ! grep -Fq 'Q3-2は部分達成' sections/07_q3_finite_graph_phenomena.md sections/09_conclusion.md
          ! grep -Fq '有限衝突近似から $D_+D_-X$ と $D_-D_+X$ までの追加誤差' sections/08_errors_resources_open_targets.md
          ! grep -Fq 'Nelson流の作用変分または時間対称Newton則を有限時間誤差付きで導く' sections/08_errors_resources_open_targets.md
          ! grep -Fq '\varepsilon_{\rm br}' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md sections/08_errors_resources_open_targets.md
          ! grep -Fq '\varepsilon_{\rm post}' sections/03_m47_controlled_w_instrument.md sections/A2_m47_controlled_w_instrument_proofs.md sections/08_errors_resources_open_targets.md
          grep -Fq 'old_half_trace_distance_factor_counterexample_margin' tools/verify_m47_q1_instrument.py
          grep -Fq '実装強化：永久記録、補助逆計算、交換リセット' sections/03_m47_controlled_w_instrument.md
          grep -Fq '永久記録、内部逆計算、未使用素子交換はこの証明に使わない' sections/A2_m47_controlled_w_instrument_proofs.md
          test -f tools/verify_r187_m37_w_q1_bridge.py
          test "$(grep -Rho '定理（R187：' sections/*.md | wc -l)" -eq 1
          grep -Fq '## 6.19 R187：M37弱結合W型からQ1 W2制御への物理接続' sections/06_m37_spatial_envelope.md
          grep -Fq '**証明（R187）**' sections/A5_m37_envelope_proofs.md
          grep -Fq '| R187 | 厳密有限次元結果・明示誤差付き構成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-1 | 達成 | M54のW2静的状態構成 | M37弱結合W型の最低2正常モード' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 達成 | M54のW2静的状態構成 | R187によるM37のW2制御用信号系' PROJECT_STATUS.md
          test "$(grep -Rho '補題（R189A：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R189B：' sections/*.md | wc -l)" -eq 1
          test "$(grep -Rho '定理（R189C：' sections/*.md | wc -l)" -eq 1
          grep -Fq '**系（固定済み作用容量入力の静的選択・固定）**' sections/02_common_canonical_modules.md
          grep -Fq '## B.18 R189Aの走行中作用容量保持' sections/A2_m47_controlled_w_instrument_proofs.md
          grep -Fq '## B.21 R189Cの有限誤差閉包と資源' sections/A2_m47_controlled_w_instrument_proofs.md
          test -f tools/verify_q1_live_zeno.py
          grep -Fq 'P_{\rm meas}^{\rm id}' sections/03_m47_controlled_w_instrument.md
          grep -Fq 'R_{i,37}^{\delta,\mathrm{lat}}' sections/A14_m54_spatial_moving_matching.md
          grep -Fq '\frac1\ell' sections/A14_m54_spatial_moving_matching.md
          grep -Fq '一般有界有向率の有限衝突持上げ' sections/A11_common_collision_bath_thermodynamics.md
          ! grep -R -E '現行Q3粒子模型.*M42|M42局在トークン|M37--M42' README.md PROJECT_STATUS.md sections/*.md

      - name: draft-85生成物を生成
        run: python tools/build_paper.py

      - name: draft-85生成物をartifactへ保存
        uses: actions/upload-artifact@v4
        with:
          name: draft-85-generated-paper
          path: |
            paper.md
            main.tex
            paper.pdf
          if-no-files-found: error

      - name: 収録PDFを退避
        run: cp paper.pdf /tmp/paper-committed.pdf

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物の同期を検査
        run: |
          set -Ee -o pipefail
          trap 'echo "::error::生成物同期検査の失敗: $BASH_COMMAND"' ERR
          git diff --exit-code -- paper.md main.tex
          pdftotext -layout /tmp/paper-committed.pdf /tmp/paper-committed.txt
          pdftotext -layout paper.pdf /tmp/paper-regenerated.txt
          diff -u /tmp/paper-committed.txt /tmp/paper-regenerated.txt
          test "$(pdfinfo /tmp/paper-committed.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')"
          test "$(pdfinfo /tmp/paper-committed.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')" = "$(pdfinfo paper.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')"
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then
            echo "::error::最終LaTeXログに禁止警告が残っている"
            exit 1
          fi

      - name: 標準構成を検査
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
          git diff --check