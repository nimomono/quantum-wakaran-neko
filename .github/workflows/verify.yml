name: 検算

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy

      - name: 数式と数値を検算
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do
            python "$script"
          done

      - name: draft-53の理論統合を検査
        run: |
          test -f sections/A8_w_two_mode_hopf_statistics.md
          test -f sections/A9_m48_paired_hopf_bell_preparation.md
          test -f sections/A10_q2_joint_bath_contract.md
          test -f sections/A11_common_collision_bath_thermodynamics.md
          test -f sections/A12_common_action_shell_state_count.md
          test -f sections/A13_q2_action_shell_statistics.md
          test ! -e sections/A8_open_quasicritical_preparation.md
          test ! -e sections/A14_q2_action_shell_statistics.md
          test ! -d simulations/m45_open_quasicritical
          test ! -e figures/m45_open_trap_diagnostics.png
          test ! -e figures/m45_conditional_ground_comparison.png
          test -f tools/verify_m35_canonical_control.py
          test -f tools/verify_m50_instrument_and_q3_handoff.py
          test ! -e tools/verify_action_distribution.py
          test ! -e tools/verify_m37_m50_position_instrument.py
          test ! -e tools/verify_m39_m48_ablation.py
          grep -Fq 'R170：M50固定入力時刻有限枝instrument' sections/02_common_canonical_modules.md
          grep -Fq 'R143：M47のR170特殊化と結果別状態更新' sections/03_m47_controlled_w_instrument.md
          grep -Fq 'R154：R170の2翼局所合成と条件付きBell応答' sections/05_m48_bell_cycle_and_audit.md
          grep -Fq 'R168：一般ray平均からM50枝統計へのQ3受渡し' sections/06_m37_spatial_envelope.md
          grep -Fq 'M35 | 有限正準制御・比較・記録モジュール' PROJECT_STATUS.md
          grep -Fq 'Born型枝生成には使わない' PROJECT_STATUS.md
          grep -Fq '| Q1-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-2 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-3 | 部分達成 |' PROJECT_STATUS.md
          grep -Fq '| Q1-4 | 未達（凍結中） |' PROJECT_STATUS.md
          grep -Fq '| Q2-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-2 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q2-3 | 未着手 |' PROJECT_STATUS.md
          grep -Fq '| Q3-1 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-2 | 未達（凍結中） |' PROJECT_STATUS.md
          grep -Fq '| Q3-3 | 達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-4 | 条件付き達成 |' PROJECT_STATUS.md
          grep -Fq '| Q3-5 | 条件付き達成 |' PROJECT_STATUS.md
          ! grep -REn 'R(150|152|165|169)|M(39|41|45|46)|R(107|108|109|110|111|120|121|122|130|131|132|137|138)' README.md PROJECT_STATUS.md sections/*.md tools/*.py
          ! grep -REn 'A14_|A13_common|A12_common_collision|A11_q2|A10_m48|A9_w_two' MANIFEST.md tools/*.py
          ! grep -REn '二mode|二モード|実現配置' README.md PROJECT_STATUS.md sections/*.md

      - name: 収録PDFを退避
        run: cp paper.pdf /tmp/paper-committed.pdf

      - name: 論文を再生成
        run: python tools/build_paper.py

      - name: 生成物の同期を検査
        run: |
          git diff --exit-code -- paper.md main.tex paper.pdf
          pdftotext -layout /tmp/paper-committed.pdf /tmp/paper-committed.txt
          pdftotext -layout paper.pdf /tmp/paper-regenerated.txt
          diff -u /tmp/paper-committed.txt /tmp/paper-regenerated.txt
          test "$(pdfinfo /tmp/paper-committed.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')"
          test "$(pdfinfo /tmp/paper-committed.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')" = "$(pdfinfo paper.pdf | awk -F: '/^Page size:/ {sub(/^ +/, "", $2); print $2}')"
          ! grep -Eq "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log

      - name: 標準構成を検査
        run: |
          test -f paper.md
          test -f main.tex
          test -f paper.pdf
          test -f LICENSE_STATUS.md
          test -f fonts/README.md
          test -f fonts/OFL.txt
          test ! -e compiled_paper.pdf
          test ! -d output
          git diff --check
