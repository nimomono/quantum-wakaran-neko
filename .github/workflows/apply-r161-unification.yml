name: 一時R161整理適用

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-r161-reorganization:
    if: ${{ github.event.pull_request.head.ref == 'draft-r161-q1-q2-q3-unification' }}
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 0

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 最新正本文面とMarkdown規約へ適応
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_r161_unification_pr.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'new, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'new, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)',
              1,
          )
          text = text.replace(r'\text{Q1型局所信号}', r'\mathrm{Q1\ local\ signal}')
          text = text.replace(r'\text{Q2型辺結合}', r'\mathrm{Q2\ edge\ coupling}')
          first = text.index('replace_once(\n    "sections/00_overview_and_contents.md",')
          second = text.index('replace_once(\n    "sections/00_overview_and_contents.md",', first + 1)
          replacement = '''replace_once(\n    "sections/00_overview_and_contents.md",\n    "M54をQ1--Q3の共通有効状態構成族、M37を空間信号とW型低2モードの物理実装層とする。状態準備・可逆操作と、排他的な測定結果形成を同一視しない。Q1/Q2の2結果射影読出しはR191ブラウン巨視的スピンinstrumentを正本とし、Q3の実在粒子位置はR164で開始面を準備した後にR161/R162で輸送する。",\n    "M54をQ1--Q3の共通有効状態構成族、M37を空間信号とW型低2モードの物理実装層とする。状態準備・可逆操作と、排他的な測定結果形成を同一視しない。Q1/Q2の2結果射影読出しはR191ブラウン巨視的スピンinstrumentを正本とし、Q3の実在粒子位置はR164で開始面を準備した後にR161/R162で輸送する。一方、Q3の信号部分系はQ1/Q2と別の代数ではなく、Q1型局所正準信号を空間配置しQ2型2体系結合を辺へ反復した特殊化として整理する。",\n)\n'''
          path.write_text(text[:first] + replacement + text[second:], encoding='utf-8')
          PY

      - name: R161整理を正本へ適用
        run: python tools/apply_r161_unification_pr.py

      - name: 正本Markdownを先行検査
        run: |
          python tools/check_source.py
          git diff --check

      - name: 組版・数値依存を導入
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: 完成版を再生成
        run: python tools/build_paper.py

      - name: 検算記録へrun情報を反映
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          PAGES=$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')
          python - "$RUN_ID" "$PAGES" <<'PY'
          from pathlib import Path
          import sys
          path = Path('VALIDATION.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('__RUN_ID__', sys.argv[1], 1)
          text = text.replace('__PDF_PAGES__', sys.argv[2], 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: 原稿・数式を検算
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: 隔離再生成と同期を検査
        run: |
          python tools/build_paper.py --output-dir build/ci
          python tools/check_generated.py build/ci
          python tools/lint_typeset.py build/ci/latex/main.log

      - name: 差分を同じPRブランチへ記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "paper: clarify R161 as the Q1-Q3 spatial core"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
