name: draft-101 apply and regenerate

on:
  push:
    branches:
      - draft-101-q3-common-micro-model

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-101-q3-common-micro-model
          lfs: true
          fetch-depth: 0

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source reorganization
        run: python tools/apply_draft101.py

      - name: Install numerical dependencies
        run: python -m pip install numpy

      - name: Run source and physics checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate canonical paper artifacts
        run: |
          python tools/build_paper.py --output-dir .
          python tools/lint_typeset.py build/latex/main.log
          rm -rf build/ci
          python tools/build_paper.py --output-dir build/ci
          python tools/check_generated.py build/ci
          git diff --check

      - name: Commit changes and remove one-shot helpers
        run: |
          rm .github/workflows/draft101_apply.yml
          rm tools/apply_draft101.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Q3-1 and Q3-2 under M58 common microscopic model"
          git push origin HEAD:draft-101-q3-common-micro-model
