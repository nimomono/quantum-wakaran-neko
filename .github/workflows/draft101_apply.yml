name: draft-101 apply and regenerate

on:
  push:
    branches:
      - draft-101-q3-common-micro-model

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-101-q3-common-micro-model
          lfs: true
          fetch-depth: 0

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply source reorganization
        run: |
          python tools/apply_draft101.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/check_source.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'q31 = next((line for line in status.splitlines() if line.startswith("| Q3-1 | 達成 |")), "")',
              'q31 = next((line for line in status.splitlines() if line.startswith("| Q3-1 | 達成 |") and "M58" in line), "")',
          )
          text = text.replace(
              'q32 = next((line for line in status.splitlines() if line.startswith("| Q3-2 | 達成 |")), "")',
              'q32 = next((line for line in status.splitlines() if line.startswith("| Q3-2 | 達成 |") and "M58" in line), "")',
          )
          path.write_text(text, encoding='utf-8')

          a23 = Path('sections/A23_q3_common_micro_model.md')
          text = a23.read_text(encoding='utf-8').replace('k_BTT', r'k_BT\,T')
          a23.write_text(text, encoding='utf-8')
          PY

      - name: Install numerical dependencies
        run: python -m pip install numpy

      - name: Run source and physics checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/verify_q3_common_micro_model.py
          python tools/run_physics_checks.py

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate canonical paper artifacts
        run: |
          python tools/build_paper.py --output-dir .
          python tools/lint_typeset.py build/latex/main.log
          rm -rf build/ci
          python tools/build_paper.py --output-dir build/ci
          python tools/check_generated.py build/ci

      - name: Commit changes and remove one-shot helpers
        run: |
          rm .github/workflows/draft101_apply.yml
          rm tools/apply_draft101.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify Q3-1 and Q3-2 under M58 common microscopic model"
          git push origin HEAD:draft-101-q3-common-micro-model
