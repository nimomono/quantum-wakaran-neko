name: draft137 generated artifacts

on:
  push:
    branches:
      - draft-137-m67-r208-candidate

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Generate paper artifacts
        run: python tools/build_paper.py --output-dir build/draft137

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draft137-generated
          path: |
            build/draft137/paper.md
            build/draft137/main.tex
            build/draft137/paper.pdf
          if-no-files-found: error
