name: draft137 generated artifacts

on:
  push:
    branches:
      - draft-137-m67-r208-candidate

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: draft-137-m67-r208-candidate
          lfs: true
          fetch-depth: 0

      - name: Pull LFS
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Generate paper artifacts
        run: python tools/build_paper.py --output-dir build/draft137

      - name: Commit generated artifacts and remove helper workflow
        run: |
          cp build/draft137/paper.md paper.md
          cp build/draft137/main.tex main.tex
          cp build/draft137/paper.pdf paper.pdf
          git rm .github/workflows/draft137-generate.yml
          git add paper.md main.tex paper.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "draft-137: AA見出し対応後の生成物を同期"
          git push origin HEAD:draft-137-m67-r208-candidate
