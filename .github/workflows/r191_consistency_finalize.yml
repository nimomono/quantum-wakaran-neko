name: R191 consistency finalize

on:
  push:
    branches:
      - docs/r191-brownian-macrospin-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Apply R191 consistency repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_r191_consistency_fix.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'out, count = pattern.subn(new.rstrip() + "\\n\\n", text, count=1)':
                  'out, count = pattern.subn(lambda _m: new.rstrip() + "\\n\\n", text, count=1)',
              's,count=old_q1.subn(new_q1,s,count=1)':
                  's,count=old_q1.subn(lambda _m: new_q1,s,count=1)',
              '## B.19 R189Bの固定済み容量R191選択と走行中射影選別':
                  '## B.19 R189Bの固定済み容量選択と走行中射影選別',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'R191 finalize replacement target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          cp PROJECT_STATUS.md /tmp/project-status-before-r191-fix.md
          python tools/apply_r191_consistency_fix.py
          python - <<'PY'
          from pathlib import Path

          start = '### 固定目標一覧'
          end = '### 現在地'
          before = Path('/tmp/project-status-before-r191-fix.md').read_text(encoding='utf-8')
          after_path = Path('PROJECT_STATUS.md')
          after = after_path.read_text(encoding='utf-8')

          def fixed_block(text: str) -> tuple[str, str, str]:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit('fixed-goal boundary markers are not unique')
              prefix, rest = text.split(start, 1)
              middle, suffix = rest.split(end, 1)
              return prefix, middle, suffix

          _, before_middle, _ = fixed_block(before)
          after_prefix, _, after_suffix = fixed_block(after)
          restored = after_prefix + start + before_middle + end + after_suffix
          after_path.write_text(restored, encoding='utf-8')

          if start + before_middle + end not in restored:
              raise SystemExit('failed to restore canonical fixed-goal block')
          PY
      - name: Compile and numerical checks
        run: |
          python -m py_compile tools/*.py
          for script in tools/verify_*.py; do
            echo "=== $script ==="
            python "$script"
          done
      - name: R191 semantic boundaries
        run: |
          set -Ee -o pipefail
          grep -Fq 'R191の2結果選択・吸収記録' sections/A16_m54_projector_tree_receiver.md
          grep -Fq 'R191による2結果選択と吸収記録' sections/02_common_canonical_modules.md
          ! grep -Fq '結果成分の排他的選択と固定は第2章R170が担う' sections/A16_m54_projector_tree_receiver.md
          ! grep -Fq '\frac{m\delta}{1+\delta}' sections/A16_m54_projector_tree_receiver.md
          ! grep -Fq '\frac{n\delta}{1+\delta}' sections/02_common_canonical_modules.md
          grep -Fq '中央R191選択・吸収記録' sections/05_m54_setting_pre_receiver.md
          grep -Fq '2個の局所R191' sections/A4_m54_receiver_cycle_proofs.md
          grep -Fq 'R191ブラウン巨視的スピン読出し接続部' PROJECT_STATUS.md
      - name: Regenerate paper
        run: python tools/build_paper.py
      - name: Validate generated PDF
        run: |
          test -s paper.pdf
          pdfinfo paper.pdf | tee /tmp/pdfinfo.txt
          pdftotext -layout paper.pdf /tmp/paper.txt
          grep -Fq 'R191' /tmp/paper.txt
          grep -Fq 'ブラウン巨視的スピン' /tmp/paper.txt
          if grep -En "Citation .* undefined|Reference .* undefined|Overfull|Underfull|Fatal error|Missing character" build/latex/main.log; then
            echo 'forbidden LaTeX warning'
            exit 1
          fi
          git diff --check
      - name: Prepare clean final commit
        run: |
          rm -f tools/apply_r191_consistency_fix.py
          rm -f .github/workflows/r191_consistency_finalize.yml
          rm -f .github/workflows/r191_consistency_audit.yml
          git config user.name 'Dr. Pot-au-Feu'
          git config user.email '146850541+nimomono@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete R191 primary readout integration'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          echo "PDF_BLOB=$(git rev-parse HEAD:paper.pdf)"
          echo "VERIFY_BLOB=$(git rev-parse HEAD:.github/workflows/verify.yml)"
          echo "A16_BLOB=$(git rev-parse HEAD:sections/A16_m54_projector_tree_receiver.md)"
          echo "COMMON_BLOB=$(git rev-parse HEAD:sections/02_common_canonical_modules.md)"
          echo "STATUS_BLOB=$(git rev-parse HEAD:PROJECT_STATUS.md)"
          git status --short
          git push -f origin HEAD:refs/heads/r191-consistency-generated
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: r191-consistency-final
          path: |
            paper.md
            main.tex
            paper.pdf
            PROJECT_STATUS.md
            README.md
            VALIDATION.md
            sections/02_common_canonical_modules.md
            sections/03_m47_controlled_w_instrument.md
            sections/05_m54_setting_pre_receiver.md
            sections/08_errors_resources_open_targets.md
            sections/A2_m47_controlled_w_instrument_proofs.md
            sections/A4_m54_receiver_cycle_proofs.md
            sections/A16_m54_projector_tree_receiver.md
            .github/workflows/verify.yml
