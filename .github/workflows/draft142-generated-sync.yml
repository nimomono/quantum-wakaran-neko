name: draft-142 generated sync

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-generated:
    if: ${{ github.head_ref == 'draft-142-m67-thermal-sector' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate tracked artifacts
        run: python tools/build_paper.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "generated artifacts already synchronized"
          else
            git commit -m "draft-142: regenerate paper artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
