name: Q3 spine cleanup finalizer pass2

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'draft-99-q3-spine-cleanup' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          lfs: true

      - name: Pull LFS assets
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Apply second-pass cleanup and regenerate manuscript
        run: python tools/finalize_q3_spine_cleanup_pass2.py

      - name: Commit finalized cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No finalization changes.'
            exit 0
          fi
          git commit -m 'draft-99: finish retired Q3 dependency cleanup'
          git push origin HEAD:${{ github.head_ref }}
