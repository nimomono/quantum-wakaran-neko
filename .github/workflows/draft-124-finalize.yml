name: draft-124 finalize

on:
  push:
    branches:
      - draft-124-retire-r164-r170-action-shell

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[generated-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS
        run: git lfs pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy

      - name: Run draft-124 migration check
        run: python tools/migrations/check_draft124_retire_r164_r170.py

      - name: Run source structure checks
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          git diff --check

      - name: Run required and candidate physics checks
        run: python tools/run_physics_checks.py --include-candidate

      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate paper artifacts
        run: python tools/build_paper.py

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            echo "Generated artifacts already synchronized."
          else
            git commit -m "draft-124: regenerate paper artifacts [generated-sync]"
            git push
          fi
