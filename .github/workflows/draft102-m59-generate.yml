name: draft-102 M59生成

on:
  push:
    branches:
      - draft-102-m59-duffing-action-reservoir

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: LFS資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数値依存を導入
        run: python -m pip install numpy

      - name: M59改訂を適用
        run: |
          python tools/apply_draft102_m59.py
          python tools/fix_draft102_escape.py
          rm tools/fix_draft102_escape.py

      - name: Python構文と原稿構造を検査
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: 組版依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: 論文を再生成
        run: |
          python tools/build_paper.py
          git diff --check

      - name: 改訂をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "draft-102: replace M58 shell with M59 Duffing action reservoir"
          git push origin HEAD:draft-102-m59-duffing-action-reservoir
