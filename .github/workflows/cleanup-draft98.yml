name: cleanup-draft98

on:
  push:
    branches:
      - draft-98-m57-ballistic-moving-bath
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-98-m57-ballistic-moving-bath
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Clean stale active M57 references
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, got {n}: {old[:100]}')
              p.write_text(t.replace(old,new,1), encoding='utf-8')

          replace_once('sections/06_m37_spatial_envelope.md',
            'Q3の親模型は第2章のM54空間信号構成とM57 dual-TL tracerである。その1試行には、実正準信号自由度、その派生表示 $Z$、1個の局在tracer位置 $X_t$、2作用状態数sector、左右独立のpinned open TLが含まれる。R195A--R195Dが状態数、bath mixing、FDT/Kramers縮約、R161生成子matchingを与える。R162は同じ生成子を持つideal stochastic referenceであり、基礎的ミクロ存在論ではない。複素状態方向と位置分布は試行集団の統計であり、$C_Z$ またはその階数1因子を単一試行制御器へ書き戻さない。',
            'Q3の親模型は第2章のM54空間信号構成とM57 dual-ballistic-TL moving-bath tracerである。その1試行には、実正準信号自由度、その派生表示 $Z$、1個の局在tracer位置 $X_t$、2作用状態数sector、左右独立のballistic TL、moving bath-frame carrier、平衡oscillator bathが含まれる。R195Aが状態数とsignal currentを厳密に与え、R196Aがballistic wave pressureからmoving bath frame、R196Bが平衡GLE/FDTとperiodic homogenization、R196CがR161生成子matchingを与える。R162は同じ生成子を持つideal stochastic referenceであり、基礎的ミクロ存在論ではない。複素状態方向と位置分布は試行集団の統計であり、$C_Z$ またはその階数1因子を単一試行制御器へ書き戻さない。')
          replace_once('sections/06_m37_spatial_envelope.md',
            'R195Aの2作用状態数が $X_0$ の条件付き重みを与え、以後は再標本化せずR195B--R195Dの同じtracer力学がR161移動生成子へ縮約する。',
            'R195Aの2作用状態数が $X_0$ の条件付き重みを与え、以後は再標本化せずR196A--R196Cの同じtracer力学がR161移動生成子へ縮約する。')
          replace_once('sections/06_m37_spatial_envelope.md',
            'M57 dual-TL tracer、時計自由度、記録器を単一反復装置へ統合したとは扱わない。',
            'M57 dual-ballistic-TL moving-bath tracer、時計自由度、記録器を単一反復装置へ統合したとは扱わない。')

          replace_once('sections/01_scope_and_cycle.md',
            'R162のopen Poisson-jump過程はM57の基礎的実体ではなく、R195Dが比較するideal R161 jump lawの参照実現として残す。',
            'R162のopen Poisson-jump過程はM57の基礎的実体ではなく、R196Cが比較するideal R161 jump lawの参照実現として残す。')
          replace_once('sections/09_conclusion.md',
            'R162のopen Poisson-jump過程はM57の基礎的実体ではなく、R195Dが比較するideal stochastic referenceとして残す。',
            'R162のopen Poisson-jump過程はM57の基礎的実体ではなく、R196Cが比較するideal stochastic referenceとして残す。')

          p=Path('sections/07_q3_finite_graph_phenomena.md')
          t=p.read_text(encoding='utf-8')
          if t.count('R195B--R195D') != 1:
              raise SystemExit(f'sections/07: expected one stale R195B--R195D, got {t.count("R195B--R195D")}')
          t=t.replace('R195B--R195D','R196A--R196C')
          if t.count(r'nu_{ij}^{\rm sig}') != 1:
              raise SystemExit(f'sections/07: expected one mistyped edge velocity, got {t.count(r"nu_{ij}^{\rm sig}")}')
          t=t.replace(r'nu_{ij}^{\rm sig}',r'u_{ij}^{\rm sig}')
          p.write_text(t,encoding='utf-8')

          replace_once('PROJECT_STATUS.md',
            'M57主線ではR86 carrier errorをR195Dへ直接渡す',
            'M57主線ではR86 carrier errorをR196Cへ直接渡す')
          replace_once('PROJECT_STATUS.md',
            'M57 Q3主線は別のdual-TL bathを用い、R190を必須依存にしない。',
            'M57 Q3主線はdual ballistic TLと平衡oscillator bathを用い、R190を必須依存にしない。')
          replace_once('PROJECT_STATUS.md',
            'Q3の単一試行ではM37/M54の実正準空間信号、1個のM57 tracer、2作用状態数、左右独立open TLが物理過程を担う。',
            'Q3の単一試行ではM37/M54の実正準空間信号、1個のM57 tracer、2作用状態数、dual ballistic TL、moving bath-frame carrier、平衡oscillator bathが物理過程を担う。')
          replace_once('PROJECT_STATUS.md',
            'その後は同じtracerが状態数free energyとTL bathの下で移動する。',
            'その後は同じtracerが状態数free energyとmoving equilibrium bathの下で移動する。')
          replace_once('PROJECT_STATUS.md',
            'Q3の強化として、M37空間signal source、M57 dual-TL tracer、時計自由度、終位置recordを同じ有限能動部分系＋Hamiltonian無限浴の単一装置周期へ統合する。',
            'Q3の強化として、M37空間signal source、M57 dual-ballistic-TL moving-bath tracer、時計自由度、終位置recordを同じ有限能動部分系＋Hamiltonian無限浴の単一装置周期へ統合する。')

          p=Path('tools/verify_m57_ballistic_tracer.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('# R195B finite-time tracking witness with time-dependent chirality.', '# R196A finite-time tracking witness with time-dependent chirality.')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Check stale active-source tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              Path('sections/06_m37_spatial_envelope.md'): ('M57 dual-TL tracer','pinned open TL','R195A--R195D','R195B--R195D'),
              Path('sections/01_scope_and_cycle.md'): ('R195Dが比較するideal',),
              Path('sections/07_q3_finite_graph_phenomena.md'): ('R195B--R195D',r'nu_{ij}^{\rm sig}'),
              Path('sections/09_conclusion.md'): ('R195Dが比較するideal',),
          }
          bad=[]
          for p,tokens in checks.items():
              text=p.read_text(encoding='utf-8')
              for token in tokens:
                  if token in text:
                      bad.append(f'{p}:{token}')
          ps=Path('PROJECT_STATUS.md').read_text(encoding='utf-8')
          marker='## 固定長期目標'
          ps=ps[ps.find(marker):] if marker in ps else ps
          for token in ('R86 carrier errorをR195D','別のdual-TL bath','左右独立open TL','状態数free energyとTL bath','M57 dual-TL tracer'):
              if token in ps:
                  bad.append(f'PROJECT_STATUS.md:{token}')
          if bad:
              raise SystemExit('stale active M57 refs: '+', '.join(bad))
          print('stale_active_m57_scan_ok')
          PY
      - name: Source and physics checks
        run: |
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check
      - name: Install typesetting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
      - name: Regenerate paper
        run: |
          python tools/build_paper.py --output-dir build/draft98-clean
          cp build/draft98-clean/paper.md paper.md
          cp build/draft98-clean/main.tex main.tex
          cp build/draft98-clean/paper.pdf paper.pdf
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/cleanup-draft98.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'draft-98: clean stale M57 references'
          git push origin HEAD:draft-98-m57-ballistic-moving-bath
