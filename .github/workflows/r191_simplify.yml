name: R191 measurement-spine simplification

on:
  push:
    branches:
      - draft-r191-measurement-spine-simplification

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: draft-r191-measurement-spine-simplification
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install numpy

      - name: Normalize regex replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_r191_simplification.py')
          s = p.read_text(encoding='utf-8')
          old = 'new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'new, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('replace_regex helper target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply simplification
        run: python tools/apply_r191_simplification.py

      - name: Normalize canonical prose terms
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('README.md'), Path('PROJECT_STATUS.md'), Path('PROJECT_STANCE.md')]
          files += [p for p in Path('sections').glob('*.md') if p.name != '90_references.md']
          replacements = {
              'branch': '結果成分',
              'repump': '再調整',
              'noise': 'ノイズ',
          }
          for p in files:
              s = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Python syntax check
        run: python -m compileall -q tools

      - name: Source structure check
        run: python tools/check_source.py

      - name: Terminology check
        run: python tools/check_terminology.py

      - name: Physics checks
        run: python tools/run_physics_checks.py

      - name: Install paper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Regenerate paper artifacts
        run: python tools/build_paper.py

      - name: Final source and diff checks
        run: |
          python tools/check_source.py
          python tools/check_terminology.py
          git diff --check
          test -s paper.md
          test -s main.tex
          test -s paper.pdf

      - name: Remove one-shot automation
        run: |
          rm -f tools/apply_r191_simplification.py
          rm -f .github/workflows/r191_simplify.yml

      - name: Commit simplified paper and generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: simplify Q1/Q2 measurement spine around R191'
          git push origin HEAD:draft-r191-measurement-spine-simplification
