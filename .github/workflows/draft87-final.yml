name: draft-87 final validation

on:
  push:
    branches:
      - docs/open-bath-simplification

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/open-bath-simplification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Validate and regenerate
        shell: bash
        run: |
          set +e
          {
            echo "== py_compile =="
            python -m py_compile tools/*.py &&
            echo "== verify scripts ==" &&
            for script in tools/verify_*.py; do
              echo "-- $script"
              python "$script" || exit $?
            done &&
            echo "== build_paper ==" &&
            python tools/build_paper.py &&
            echo "== git diff check ==" &&
            git diff --check
          } > draft87-action.log 2>&1
          rc=$?
          cat draft87-action.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            git add paper.md main.tex paper.pdf
          fi
          git add draft87-action.log
          git rm .github/workflows/draft87-final.yml
          git commit -m "draft-87: final validation and regenerate artifacts"
          git push origin HEAD:docs/open-bath-simplification
          exit "$rc"
