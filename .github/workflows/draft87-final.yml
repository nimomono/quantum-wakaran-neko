name: draft-87 final validation

on:
  push:
    branches:
      - docs/open-bath-simplification

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/open-bath-simplification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Validate and regenerate
        shell: bash
        run: |
          set +e
          : > draft87-action.log
          rc=0

          echo "== py_compile ==" >> draft87-action.log
          python -m py_compile tools/*.py >> draft87-action.log 2>&1 || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "== verify scripts ==" >> draft87-action.log
            for script in tools/verify_*.py; do
              echo "-- $script" >> draft87-action.log
              python "$script" >> draft87-action.log 2>&1
              rc=$?
              if [ "$rc" -ne 0 ]; then
                break
              fi
            done
          fi

          if [ "$rc" -eq 0 ]; then
            echo "== build_paper ==" >> draft87-action.log
            python tools/build_paper.py >> draft87-action.log 2>&1 || rc=$?
          fi

          if [ "$rc" -eq 0 ]; then
            echo "== git diff check ==" >> draft87-action.log
            git diff --check >> draft87-action.log 2>&1 || rc=$?
          fi

          cat draft87-action.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$rc" -eq 0 ]; then
            git add paper.md main.tex paper.pdf
          fi
          git add draft87-action.log
          git rm .github/workflows/draft87-final.yml
          git commit -m "draft-87: final validation and regenerate artifacts"
          git push origin HEAD:docs/open-bath-simplification
          exit "$rc"
