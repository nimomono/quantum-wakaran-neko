name: draft-90 compression

on:
  push:
    branches:
      - draft-r191-residual-compression

permissions:
  contents: write

jobs:
  compress-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft-r191-residual-compression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply compression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_draft90_compression.py')
          s = p.read_text(encoding='utf-8')
          old = 'out, n = re.subn(pattern, repl, text, count=1, flags=flags)'
          new = 'out, n = re.subn(pattern, lambda _match: repl, text, count=1, flags=flags)'
          if old not in s:
              raise SystemExit('draft-90 literal replacement patch target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/apply_draft90_compression.py
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex
          python -m pip install numpy
      - name: Validate and regenerate
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          python tools/build_paper.py
          git diff --check
      - name: Commit sources and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md VALIDATION.md MANIFEST.md sections notes tools paper.md main.tex paper.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "draft-90: compress residual R191 measurement responsibilities"
          git push origin HEAD:draft-r191-residual-compression
