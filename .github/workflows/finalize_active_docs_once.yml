name: Finalize active docs once

on:
  push:
    branches:
      - draft-readme-status-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: draft-readme-status-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final PROJECT_STATUS cleanup
        run: python tools/_finalize_active_docs_once.py

      - name: Check sources
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/check_terminology.py
          git diff --check

      - name: Install numerical dependency
        run: python -m pip install numpy

      - name: Run physics checks
        run: python tools/run_physics_checks.py

      - name: Install paper build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: Rebuild paper artifacts
        run: python tools/build_paper.py

      - name: Verify final outputs
        run: |
          pdfinfo paper.pdf | grep -E 'Pages:|Page size:|PDF version:'
          git diff --check
          ! grep -q 'R181Aのポンプ／供給源' PROJECT_STATUS.md
          grep -q 'R191読出し、R181Dの射影成分振り分け' PROJECT_STATUS.md
          ! grep -q '## 長期目標の現在地' README.md
          ! grep -q '### 現行の模型・実装階層' README.md
          ! grep -q '\*\*証明（R181D）\*\*' sections/A3_m54_q2_specialization_proofs.md
          grep -q 'R189A--R189Cで別に構成する' sections/03_m47_controlled_w_instrument.md

      - name: Upload final PDF
        uses: actions/upload-artifact@v4
        with:
          name: active-docs-cleanup-final-paper
          path: paper.pdf

      - name: Remove one-shot files
        run: |
          rm -f tools/_finalize_active_docs_once.py
          rm -f .github/workflows/finalize_active_docs_once.yml

      - name: Commit and push finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md paper.md main.tex paper.pdf tools/_finalize_active_docs_once.py .github/workflows/finalize_active_docs_once.yml
          git commit -m "docs: finish active status alignment"
          git push origin HEAD:draft-readme-status-cleanup
