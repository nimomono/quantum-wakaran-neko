name: R193 finalize artifact

on:
  push:
    branches:
      - draft-r193-q1-macrospin-bridge

permissions:
  contents: write

jobs:
  finalize:
    name: R193最終生成
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を導入
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: R193本文更新を適用
        run: |
          python tools/apply_r193_repo_update.py
          python tools/sanitize_r193_terms.py

      - name: 構造と物理を検算
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: 正規生成物を生成
        run: python tools/build_paper.py

      - name: 隔離再生成で同期を確認
        run: |
          python tools/build_paper.py --output-dir build/ci
          python tools/check_generated.py build/ci
          python tools/lint_typeset.py build/ci/latex/main.log

      - name: 一時生成資産を除去して最終コミット
        run: |
          rm -f .github/workflows/r193-finalize-artifact.yml
          rm -f tools/apply_r193_repo_update.py tools/sanitize_r193_terms.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "theory: integrate R193 Q1 macrospin bridge"
          git push origin HEAD:draft-r193-q1-macrospin-bridge
