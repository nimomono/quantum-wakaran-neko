name: R193 finalize artifact

on:
  push:
    branches:
      - draft-r193-q1-macrospin-bridge

permissions:
  contents: read

jobs:
  finalize:
    name: R193最終生成
    runs-on: ubuntu-latest
    steps:
      - name: 原稿を取得
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: LFS生成資産を取得
        run: git lfs pull

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を導入
        run: |
          python -m pip install numpy
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils texlive-latex-extra texlive-xetex

      - name: R193本文更新を適用
        run: |
          python tools/apply_r193_repo_update.py
          python tools/sanitize_r193_terms.py

      - name: 構造と物理を検算
        run: |
          python -m compileall -q tools
          python tools/check_source.py
          python tools/test_validation_policy.py
          python tools/check_terminology.py
          python tools/run_physics_checks.py
          git diff --check

      - name: 正規生成物を生成
        run: python tools/build_paper.py

      - name: 隔離再生成で同期を確認
        run: |
          python tools/build_paper.py --output-dir build/ci
          python tools/check_generated.py build/ci
          python tools/lint_typeset.py build/ci/latex/main.log

      - name: 最終コミット候補を収集
        run: |
          rm -rf build/r193-final
          mkdir -p build/r193-final
          git diff --name-only -z | while IFS= read -r -d '' f; do
            mkdir -p "build/r193-final/$(dirname "$f")"
            cp "$f" "build/r193-final/$f"
          done
          for f in \
            sections/01_scope_and_cycle.md \
            sections/A8_m47_w2_parameter_dictionary.md \
            sections/A21_q1_r193_macrospin_bridge.md \
            tools/verify_q1_r193_macrospin_bridge.py \
            paper.md main.tex paper.pdf
          do
            mkdir -p "build/r193-final/$(dirname "$f")"
            cp "$f" "build/r193-final/$f"
          done
          (
            cd build/r193-final
            find . -type f -print | sort > FINAL_MANIFEST.txt
          )

      - name: 最終候補をartifact化
        uses: actions/upload-artifact@v4
        with:
          name: r193-final-tree
          path: build/r193-final
          if-no-files-found: error
          retention-days: 3
